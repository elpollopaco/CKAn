# =============================================================================
# Commander Keen (1-6, Dreams, Keen 7 mod) para Android - build.yml unico
#
# Colocar en: .github/workflows/build.yml
# Colocar tambien: icon.png en la raiz del repo (icono propio de la app)
#
# Que hace:
#   1. Clona la distro Android de Commander Genius (pelya/commandergenius),
#      SIN descargar las apps ajenas (Teeworlds, OpenTTD...) que daban timeout.
#   2. Instala un "inyector": envuelve changeAppSettings.sh para que, cada vez
#      que la distro regenere el proyecto, se vuelva a aplicar:
#        - ImportActivity (pantalla inicial que pide el ZIP de los juegos):
#            * verifica el SHA-256 hardcodeado (EXPECTED_SHA256 en el Java)
#            * copia los juegos a files/games de la app (Commander Genius los
#              detecta solo y los muestra en la coleccion); luego puedes borrar
#              el ZIP y las carpetas originales
#        - parche del manifest (ImportActivity como pantalla de inicio)
#        - tu icon.png de la raiz del repo como icono
#   3. Compila, firma (clave debug si hace falta) y VERIFICA que el APK
#      contiene ImportActivity antes de subirlo como artefacto.
#
# Si algo falla, el ultimo paso imprime un diagnostico completo.
# =============================================================================
name: Build Commander Keen APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CG_BRANCH: sdl_android
      CG_APP: commandergenius
    steps:
      - name: Checkout (tu repo)
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clonar distro (sin las apps ajenas)
        run: |
          set -euo pipefail
          # El runner no puede usar git:// (puerto 9418): forzar https
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git clone --branch "$CG_BRANCH" https://github.com/pelya/commandergenius.git cg
          cd cg
          # No descargar los submodulos de otras apps (Teeworlds, OpenTTD, etc.)
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r key path; do
            name="${key#submodule.}"; name="${name%.path}"
            case "$path" in
              "project/jni/application/$CG_APP"/*) echo "descargar: $path" ;;
              project/jni/application/*) git config "submodule.$name.update" none; echo "omitir:    $path" ;;
              *) echo "descargar: $path" ;;
            esac
          done
          git submodule update --init --recursive --jobs 4
          test -f "project/jni/application/$CG_APP/AndroidAppSettings.cfg" || { echo "Falta el cfg de $CG_APP"; ls project/jni/application; exit 1; }
          test -d "project/jni/application/$CG_APP/commandergenius" || { echo "Falta el codigo de Commander Genius"; exit 1; }

      - name: Entorno Android (licencias, NDK, clave debug)
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ln -sfn "$ANDROID_HOME/licenses" cg/project/licenses
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "No hay NDK"; ls "$ANDROID_HOME/ndk" || true; exit 1; fi
          echo "NDK usado: $NDK"
          echo "$NDK" >> "$GITHUB_PATH"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
            echo "KEEN_TOOLS=$GITHUB_WORKSPACE/keen_tools"
            echo "KEEN_CG=$GITHUB_WORKSPACE/cg"
          } >> "$GITHUB_ENV"
          # Clave debug (algunos scripts de la distro la esperan en ~/.android)
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Herramientas del inyector
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/keen_tools"
          cd "$GITHUB_WORKSPACE/keen_tools"

          cat > ImportActivity.java.tpl <<'JAVA_EOF'
          package __PKG__;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.ActivityInfo;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.OpenableColumns;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;

          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.FilterInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          @android.annotation.TargetApi(19)
          public class ImportActivity extends Activity {

              // ===================== CONFIGURACION HARDCODEADA =====================
              private static final String EXPECTED_SHA256 =
                      "163f6742469a6ce9ec9e1f28a22cfcc377127ac276c3431555727ff693ba769e";
              private static final String GAMES_SUBDIR = "games";
              private static final String MARKER_FILE = "keen_zip_import.txt";
              private static final String TMP_DIR = "keen_import_tmp";
              private static final long MAX_EXTRACT_BYTES = 1024L * 1024L * 1024L;
              private static final int REQ_PICK = 4242;
              // =====================================================================

              private final Handler ui = new Handler(Looper.getMainLooper());
              private TextView status;
              private ProgressBar bar;
              private Button pick;
              private boolean working = false;
              private long lastPost = 0;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  File base = getExternalFilesDir(null);
                  if (base != null && alreadyImported(base)) {
                      launchGame();
                      return;
                  }
                  buildUi();
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  int pad = (int) (24 * getResources().getDisplayMetrics().density);
                  root.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("Commander Keen");
                  title.setTextSize(26);
                  title.setGravity(Gravity.CENTER);

                  TextView info = new TextView(this);
                  info.setText("Selecciona el ZIP con los juegos. Se verificará y se copiará a la app; "
                          + "después ya no necesitarás el ZIP.");
                  info.setGravity(Gravity.CENTER);
                  info.setPadding(0, pad, 0, pad);

                  pick = new Button(this);
                  pick.setText("Seleccionar ZIP");
                  pick.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          pickZip();
                      }
                  });

                  bar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  bar.setMax(1000);

                  status = new TextView(this);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, pad, 0, 0);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  root.addView(title, lp);
                  root.addView(info, lp);
                  root.addView(pick, lp);
                  root.addView(bar, lp);
                  root.addView(status, lp);
                  setContentView(root);
              }

              private void pickZip() {
                  if (working) return;
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES, new String[] {
                          "application/zip", "application/x-zip-compressed", "application/octet-stream"
                  });
                  startActivityForResult(i, REQ_PICK);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      startImport(data.getData());
                  }
              }

              private void startImport(final Uri uri) {
                  if (working) return;
                  working = true;
                  pick.setEnabled(false);
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          File tmp = null;
                          try {
                              File base = getExternalFilesDir(null);
                              if (base == null) throw new IOException("Almacenamiento de la app no disponible");
                              long total = querySize(uri);

                              String got = sha256(uri, total);
                              if (!got.equalsIgnoreCase(EXPECTED_SHA256)) {
                                  fail("El ZIP no coincide con el esperado.\nSHA-256 obtenido:\n" + got);
                                  return;
                              }

                              tmp = new File(base, TMP_DIR);
                              deleteRec(tmp);
                              tmp.mkdirs();
                              extract(uri, tmp, total);

                              progress("Añadiendo juegos a la colección...", 1, 1);
                              int n = installGames(tmp, new File(base, GAMES_SUBDIR));
                              deleteRec(tmp);
                              if (n == 0) {
                                  fail("No se encontraron juegos dentro del ZIP.");
                                  return;
                              }
                              writeText(new File(base, MARKER_FILE), EXPECTED_SHA256);
                              done(n);
                          } catch (Throwable t) {
                              if (tmp != null) deleteRec(tmp);
                              fail("Error: " + t.getMessage());
                          }
                      }
                  }).start();
              }

              // ----------------------------- UI helpers --------------------------
              private void progress(final String text, final long done, final long total) {
                  long now = System.currentTimeMillis();
                  if (now - lastPost < 120 && done < total) return;
                  lastPost = now;
                  final int p = total > 0 ? (int) Math.min(1000L, done * 1000L / total) : 0;
                  final boolean indet = total <= 0;
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          status.setText(text);
                          bar.setIndeterminate(indet);
                          if (!indet) bar.setProgress(p);
                      }
                  });
              }

              private void fail(final String msg) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          working = false;
                          bar.setIndeterminate(false);
                          bar.setProgress(0);
                          status.setText(msg);
                          pick.setEnabled(true);
                      }
                  });
              }

              private void done(final int n) {
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          bar.setIndeterminate(false);
                          bar.setProgress(1000);
                          status.setText("Listo: " + n + " juego(s) añadidos a la colección.");
                      }
                  });
                  ui.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          launchGame();
                      }
                  }, 900);
              }

              private void launchGame() {
                  try {
                      PackageInfo pi = getPackageManager().getPackageInfo(getPackageName(),
                              PackageManager.GET_ACTIVITIES);
                      String target = null;
                      if (pi.activities != null) {
                          for (ActivityInfo ai : pi.activities) {
                              if (ai.name != null && ai.name.endsWith("MainActivity")) {
                                  target = ai.name;
                                  break;
                              }
                          }
                      }
                      if (target == null) throw new Exception("MainActivity no encontrada");
                      Intent i = new Intent();
                      i.setClassName(getPackageName(), target);
                      startActivity(i);
                      finish();
                  } catch (Exception e) {
                      if (status != null) status.setText("No se pudo iniciar el juego: " + e.getMessage());
                  }
              }

              // ----------------------------- Logica de ZIP -----------------------
              private boolean alreadyImported(File base) {
                  try {
                      File m = new File(base, MARKER_FILE);
                      if (!m.isFile()) return false;
                      if (!readText(m).trim().equalsIgnoreCase(EXPECTED_SHA256)) return false;
                      File games = new File(base, GAMES_SUBDIR);
                      File[] fs = games.listFiles();
                      if (fs == null) return false;
                      for (File f : fs) if (f.isDirectory()) return true;
                      return false;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private long querySize(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[] { OpenableColumns.SIZE }, null, null, null);
                      if (c != null && c.moveToFirst() && !c.isNull(0)) return c.getLong(0);
                  } catch (Exception e) {
                      // sin tamaño: barra indeterminada
                  } finally {
                      if (c != null) c.close();
                  }
                  return -1;
              }

              private String sha256(Uri uri, long total) throws Exception {
                  MessageDigest md = MessageDigest.getInstance("SHA-256");
                  InputStream in = getContentResolver().openInputStream(uri);
                  if (in == null) throw new IOException("No se pudo abrir el archivo");
                  try {
                      byte[] buf = new byte[65536];
                      long done = 0;
                      int n;
                      while ((n = in.read(buf)) != -1) {
                          md.update(buf, 0, n);
                          done += n;
                          progress("Verificando ZIP...", done, total);
                      }
                  } finally {
                      in.close();
                  }
                  StringBuilder sb = new StringBuilder();
                  for (byte x : md.digest()) sb.append(String.format(Locale.ROOT, "%02x", x));
                  return sb.toString();
              }

              private static class CountingIn extends FilterInputStream {
                  long count = 0;

                  CountingIn(InputStream in) {
                      super(in);
                  }

                  @Override
                  public int read() throws IOException {
                      int b = super.read();
                      if (b >= 0) count++;
                      return b;
                  }

                  @Override
                  public int read(byte[] b, int o, int l) throws IOException {
                      int n = super.read(b, o, l);
                      if (n > 0) count += n;
                      return n;
                  }
              }

              private void extract(Uri uri, File dest, long total) throws Exception {
                  InputStream raw = getContentResolver().openInputStream(uri);
                  if (raw == null) throw new IOException("No se pudo abrir el archivo");
                  CountingIn cin = new CountingIn(raw);
                  ZipInputStream zin = new ZipInputStream(new BufferedInputStream(cin, 65536));
                  String root = dest.getCanonicalPath() + File.separator;
                  byte[] buf = new byte[65536];
                  long written = 0;
                  try {
                      ZipEntry e;
                      while ((e = zin.getNextEntry()) != null) {
                          String name = e.getName().replace('\\', '/');
                          while (name.startsWith("/")) name = name.substring(1);
                          if (name.length() == 0 || name.startsWith("__MACOSX/") || name.contains("/__MACOSX/")) {
                              continue;
                          }
                          File out = new File(dest, name);
                          if (!out.getCanonicalPath().startsWith(root)) {
                              throw new IOException("Ruta inválida en el ZIP: " + name);
                          }
                          if (e.isDirectory() || name.endsWith("/")) {
                              out.mkdirs();
                              continue;
                          }
                          File parent = out.getParentFile();
                          if (parent != null) parent.mkdirs();
                          OutputStream os = new FileOutputStream(out);
                          try {
                              int n;
                              while ((n = zin.read(buf)) != -1) {
                                  written += n;
                                  if (written > MAX_EXTRACT_BYTES) {
                                      throw new IOException("El ZIP descomprimido es demasiado grande");
                                  }
                                  os.write(buf, 0, n);
                                  progress("Copiando juegos...", cin.count, total);
                              }
                          } finally {
                              os.close();
                          }
                      }
                  } finally {
                      zin.close();
                  }
              }

              private boolean hasExe(File dir) {
                  File[] fs = dir.listFiles();
                  if (fs == null) return false;
                  for (File f : fs) {
                      if (f.isFile() && f.getName().toLowerCase(Locale.ROOT).endsWith(".exe")) return true;
                  }
                  return false;
              }

              private void findGameDirs(File dir, List<File> out) {
                  if (hasExe(dir)) {
                      out.add(dir);
                      return;
                  }
                  File[] fs = dir.listFiles();
                  if (fs == null) return;
                  for (File f : fs) if (f.isDirectory()) findGameDirs(f, out);
              }

              private int installGames(File tmp, File games) throws IOException {
                  List<File> found = new ArrayList<File>();
                  findGameDirs(tmp, found);
                  if (found.isEmpty()) {
                      File[] top = tmp.listFiles();
                      if (top != null) for (File f : top) if (f.isDirectory()) found.add(f);
                  }
                  if (found.isEmpty()) return 0;
                  games.mkdirs();
                  Set<String> used = new HashSet<String>();
                  int n = 0;
                  for (File d : found) {
                      String name = d.equals(tmp) ? "Keen" : d.getName();
                      String unique = name;
                      int k = 2;
                      while (used.contains(unique.toLowerCase(Locale.ROOT))) unique = name + "_" + (k++);
                      used.add(unique.toLowerCase(Locale.ROOT));
                      File dest = new File(games, unique);
                      deleteRec(dest);
                      if (!d.renameTo(dest)) {
                          copyRec(d, dest);
                          deleteRec(d);
                      }
                      n++;
                  }
                  return n;
              }

              private static void deleteRec(File f) {
                  if (f == null || !f.exists()) return;
                  File[] fs = f.listFiles();
                  if (fs != null) for (File c : fs) deleteRec(c);
                  f.delete();
              }

              private static void copyRec(File src, File dst) throws IOException {
                  if (src.isDirectory()) {
                      dst.mkdirs();
                      File[] fs = src.listFiles();
                      if (fs != null) for (File c : fs) copyRec(c, new File(dst, c.getName()));
                      return;
                  }
                  InputStream in = new FileInputStream(src);
                  try {
                      OutputStream os = new FileOutputStream(dst);
                      try {
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) != -1) os.write(buf, 0, n);
                      } finally {
                          os.close();
                      }
                  } finally {
                      in.close();
                  }
              }

              private static void writeText(File f, String s) throws IOException {
                  OutputStream os = new FileOutputStream(f);
                  try {
                      os.write(s.getBytes("UTF-8"));
                  } finally {
                      os.close();
                  }
              }

              private static String readText(File f) throws IOException {
                  InputStream in = new FileInputStream(f);
                  try {
                      byte[] buf = new byte[512];
                      int n = in.read(buf);
                      return n > 0 ? new String(buf, 0, n, "UTF-8") : "";
                  } finally {
                      in.close();
                  }
              }
          }
          JAVA_EOF

          cat > patch_manifest.py <<'PY_EOF'
          import sys
          import xml.etree.ElementTree as ET

          ANDROID = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID)
          ET.register_namespace("tools", "http://schemas.android.com/tools")


          def a(n):
              return "{%s}%s" % (ANDROID, n)


          path, pkg = sys.argv[1], sys.argv[2]
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              sys.exit("No hay <application> en " + path)

          main = None
          for act in app.findall("activity"):
              if act.get(a("name"), "").endswith("MainActivity"):
                  main = act
          if main is None:
              sys.exit("MainActivity no encontrada en " + path)

          # MainActivity deja de ser la pantalla de inicio (se lanza desde ImportActivity)
          for f in list(main.findall("intent-filter")):
              names = [x.get(a("name")) for x in f.findall("action")]
              if "android.intent.action.MAIN" in names:
                  main.remove(f)

          full = pkg + ".ImportActivity"
          if not any(x.get(a("name")) == full for x in app.findall("activity")):
              imp = ET.SubElement(app, "activity")
              imp.set(a("name"), full)
              imp.set(a("exported"), "true")
              imp.set(a("theme"), "@android:style/Theme.DeviceDefault.NoActionBar")
              imp.set(a("configChanges"), "orientation|screenSize|keyboardHidden")
              f = ET.SubElement(imp, "intent-filter")
              ET.SubElement(f, "action").set(a("name"), "android.intent.action.MAIN")
              ET.SubElement(f, "category").set(a("name"), "android.intent.category.LAUNCHER")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("manifest parcheado:", path, "->", full)
          PY_EOF

          cat > check_apk.py <<'CHECK_EOF'
          import sys
          import zipfile

          apk = sys.argv[1]
          z = zipfile.ZipFile(apk)
          names = z.namelist()


          def has(data, s):
              return s.encode() in data or s.encode("utf-16-le") in data


          man = z.read("AndroidManifest.xml") if "AndroidManifest.xml" in names else b""
          ok_manifest = has(man, "ImportActivity")
          dex = [n for n in names if n.startswith("classes") and n.endswith(".dex")]
          ok_dex = any(has(z.read(n), "ImportActivity") for n in dex)
          print("%s: manifest=%s dex=%s" % (apk, "OK" if ok_manifest else "FALTA", "OK" if ok_dex else "FALTA"))
          if not (ok_manifest and ok_dex):
              print("ERROR: el APK no incluye ImportActivity (la inyeccion se perdio durante la compilacion)")
              sys.exit(1)
          CHECK_EOF

          cat > inject.sh <<'INJECT_EOF'
          #!/usr/bin/env bash
          # Se ejecuta SIEMPRE justo despues de changeAppSettings.sh (que regenera project/src y el manifest)
          set -euo pipefail
          cd "$KEEN_CG"

          CFG=AndroidAppSettings.cfg
          PKG="$(grep -m1 '^AppFullName=' "$CFG" | sed 's/^AppFullName=//; s/"//g' | tr -d '\r ' || true)"
          [ -n "$PKG" ] || { echo "inject: no se pudo leer AppFullName de $CFG"; exit 1; }

          # ---------- 1) ImportActivity.java junto a MainActivity.java ----------
          MAIN_JAVA="$(find project/src -name MainActivity.java 2>/dev/null | head -n1 || true)"
          if [ -z "$MAIN_JAVA" ]; then
            MAIN_JAVA="$(find project -name MainActivity.java -not -path '*/jni/*' -not -path '*/build/*' 2>/dev/null | head -n1 || true)"
          fi
          if [ -n "$MAIN_JAVA" ]; then
            JAVA_DIR="$(dirname "$MAIN_JAVA")"
            JPKG="$(grep -m1 '^package ' "$MAIN_JAVA" | sed 's/^package //; s/;.*//' | tr -d '\r ' || true)"
            if [ -n "$JPKG" ]; then PKG="$JPKG"; fi
          else
            JAVA_DIR="project/src"
            echo "inject: AVISO: no hay MainActivity.java; se usa $JAVA_DIR con paquete $PKG"
          fi
          mkdir -p "$JAVA_DIR"
          sed "s/__PKG__/$PKG/" "$KEEN_TOOLS/ImportActivity.java.tpl" > "$JAVA_DIR/ImportActivity.java"

          # ---------- 2) Manifest: ImportActivity pasa a ser la pantalla de inicio ----------
          patched=0
          while IFS= read -r M; do
            [ -n "$M" ] || continue
            if grep -q 'MainActivity' "$M"; then
              python3 "$KEEN_TOOLS/patch_manifest.py" "$M" "$PKG"
              patched=$((patched + 1))
            fi
          done < <(find project -name AndroidManifest.xml -not -path '*/jni/*' -not -path '*/build/*')
          if [ "$patched" -eq 0 ]; then
            echo "inject: ERROR: no hay ningun AndroidManifest.xml con MainActivity"
            find project -name AndroidManifest.xml | head -20
            exit 1
          fi

          # ---------- 3) Icono propio (icon.png en la raiz del repo) ----------
          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            while IFS= read -r I; do
              [ -n "$I" ] || continue
              cp -f "$GITHUB_WORKSPACE/icon.png" "$I"
              echo "inject: icono propio aplicado en $I"
            done < <(find project -path '*/res/*' -name icon.png -not -path '*/jni/*' -not -path '*/build/*')
          fi

          # ---------- 4) Evitar que build.sh considere el proyecto "desactualizado" ----------
          if [ -f project/src/Globals.java ]; then touch project/src/Globals.java; fi

          echo "inject OK: java=$JAVA_DIR/ImportActivity.java paquete=$PKG manifests=$patched"
          INJECT_EOF
          chmod +x inject.sh
          ls -la

      - name: Seleccionar app, icono y generar proyecto
        run: |
          set -euo pipefail
          cd cg
          APPDIR="project/jni/application/$CG_APP"
          # app seleccionada (enlace relativo, sin barras) y cfg de la raiz apuntando a ella
          rm -f project/jni/application/src
          ln -s "$CG_APP" project/jni/application/src
          rm -f AndroidAppSettings.cfg
          ln -s "$APPDIR/AndroidAppSettings.cfg" AndroidAppSettings.cfg
          # icono propio: lo usa changeAppSettings y ademas lo reaplica el inyector
          if [ -f "$GITHUB_WORKSPACE/icon.png" ]; then
            cp -f "$GITHUB_WORKSPACE/icon.png" "$APPDIR/icon.png"
            echo "icon.png propio copiado a $APPDIR"
          else
            echo "AVISO: no hay icon.png en la raiz del repo; se usa el icono por defecto"
          fi
          # Envolver changeAppSettings.sh: tras regenerar el proyecto, aplicar el inyector
          mv changeAppSettings.sh changeAppSettings.orig.sh
          cat > changeAppSettings.sh <<'WRAP_EOF'
          #!/bin/sh
          cd "$(dirname "$0")" || exit 1
          ./changeAppSettings.orig.sh "$@" || exit $?
          bash "$KEEN_TOOLS/inject.sh" || exit $?
          WRAP_EOF
          chmod +x changeAppSettings.sh changeAppSettings.orig.sh
          ./changeAppSettings.sh -a
          echo "--- activities del manifest:"
          grep -n 'activity' project/AndroidManifest.xml || true

      - name: Compilar
        run: |
          set -euo pipefail
          cd cg
          echo "--- lineas relevantes de build.sh:"
          grep -n -i 'changeAppSettings\|gradle\|\.apk\|outputs\|PreBuild' build.sh | head -60 || true
          touch "$RUNNER_TEMP/antes_de_compilar"
          ./build.sh debug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Reunir, firmar y verificar APK
        run: |
          set -euo pipefail
          mkdir -p salida
          {
            find cg -maxdepth 1 -name '*.apk'
            find cg/project -path '*/outputs/apk/*' -name '*.apk'
            find cg/project/bin -maxdepth 1 -name '*.apk' 2>/dev/null || true
          } | while read -r f; do
            if [ "$f" -nt "$RUNNER_TEMP/antes_de_compilar" ]; then cp -v "$f" salida/; fi
          done
          if ! ls salida/*.apk > /dev/null 2>&1; then
            echo "No se genero ningun APK nuevo. APKs existentes:"; find cg -name '*.apk' | head -20
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          KS="$HOME/.android/debug.keystore"
          for f in salida/*.apk; do
            if "$BT/apksigner" verify "$f" > /dev/null 2>&1; then
              echo "firma valida: $f"
            else
              echo "sin firma valida: alineando y firmando con la clave debug: $f"
              "$BT/zipalign" -p -f 4 "$f" "$f.aligned"
              "$BT/apksigner" sign --ks "$KS" --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias androiddebugkey --out "$f.signed" "$f.aligned"
              mv "$f.signed" "$f"; rm -f "$f.aligned" "$f.signed.idsig" "$f.idsig"
              "$BT/apksigner" verify "$f"
            fi
            python3 "$KEEN_TOOLS/check_apk.py" "$f"
          done
          ls -la salida

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: commander-keen-apk
          path: salida/*.apk
          if-no-files-found: error

      - name: Diagnostico (solo si falla)
        if: failure()
        run: |
          cd cg || exit 0
          echo "=== NDK ==="; echo "$ANDROID_NDK_HOME"; ls "$ANDROID_HOME/ndk" || true
          echo "=== Submodulos descargados ==="; git submodule status | grep -v '^-' | head -30 || true
          echo "=== App ==="; ls -la "project/jni/application/$CG_APP" || true
          echo "=== project/src ==="; ls project/src 2>/dev/null | head -60 || true
          echo "=== ImportActivity ==="; find project -name ImportActivity.java -not -path '*/jni/*' || true
          echo "=== Manifests ==="; find project -name AndroidManifest.xml -not -path '*/jni/*' || true
          echo "=== project/AndroidManifest.xml ==="; sed -n '1,80p' project/AndroidManifest.xml 2>/dev/null || true
          echo "=== Wrapper ==="; head -5 changeAppSettings.sh || true
          echo "=== APKs ==="; find . -name '*.apk' -not -path '*/hid-pc-keyboard/*' | head || true
          echo "=== Ultimas lineas del build ==="; tail -n 80 "$RUNNER_TEMP/build.log" 2>/dev/null || true
