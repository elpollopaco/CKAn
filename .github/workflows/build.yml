# Commander Keen 1-7 para Android (sin Commander Genius).
# Un solo archivo: este build.yml genera el proyecto Android completo, descarga DOSBox (js-dos 6.22.60)
# y compila el APK. Pon tambien un icon.png en la raiz del repo (es el icono de la app).
#
# Como funciona: la app abre un WebView sin internet, importa el ZIP (comprobando su SHA-256),
# copia los juegos dentro de la app y los ejecuta con DOSBox (WebAssembly) con controles tactiles propios.
name: Commander Keen APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear proyecto Android (Gradle, manifiesto, estilos)
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/java/com/elpollopaco/commanderkeen android/app/src/main/assets/www/jsdos android/app/src/main/res/values
          cat > android/settings.gradle <<'__KEEN_EOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CommanderKeen"
          include ':app'
          __KEEN_EOF__
          cat > android/build.gradle <<'__KEEN_EOF__'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          __KEEN_EOF__
          cat > android/gradle.properties <<'__KEEN_EOF__'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          __KEEN_EOF__
          cat > android/app/build.gradle <<'__KEEN_EOF__'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.elpollopaco.commanderkeen'
              compileSdk 34

              defaultConfig {
                  applicationId "com.elpollopaco.commanderkeen"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          __KEEN_EOF__
          cat > android/app/src/main/AndroidManifest.xml <<'__KEEN_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Commander Keen"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode|density"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:windowSoftInputMode="adjustNothing">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          __KEEN_EOF__
          cat > android/app/src/main/res/values/styles.xml <<'__KEEN_EOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          __KEEN_EOF__

      - name: Crear codigo Java (importador y actividad)
        run: |
          set -euo pipefail
          cat > android/app/src/main/java/com/elpollopaco/commanderkeen/KeenImporter.java <<'__KEEN_EOF__'
          package com.elpollopaco.commanderkeen;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Enumeration;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.TreeMap;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipFile;
          import java.util.zip.ZipOutputStream;

          /**
           * Takes the verified ZIP with the original games and writes one ZIP per episode
           * (ep1.zip ... ep7.zip) plus games.json into outDir. No Android classes here.
           * Episode 7 = Keen Dreams.
           */
          final class KeenImporter {

              interface Progress {
                  void update(String text, int percent);
              }

              static final String[] TITLES = {
                  "", "Marooned on Mars", "The Earth Explodes", "Keen Must Die!",
                  "Secret of the Oracle", "The Armageddon Machine",
                  "Aliens Ate My Baby Sitter!", "Keen Dreams"
              };

              private static final Pattern KEEN_EXE = Pattern.compile("^keen([1-6])([a-z]?)\\.exe$");
              private static final Pattern DREAMS_EXE = Pattern.compile("^kdreams([a-z]?)\\.exe$");
              private static final Pattern CK_EXT = Pattern.compile("\\.ck([1-6])$");

              private static final class Cand {
                  int ep;
                  String dir;   // "" or "folder/sub/" (always ends with '/')
                  String base;  // exe file name
                  int score;
              }

              private KeenImporter() {
              }

              static String normalize(String name) {
                  String n = name.replace('\\', '/');
                  while (n.startsWith("./")) {
                      n = n.substring(2);
                  }
                  while (n.startsWith("/")) {
                      n = n.substring(1);
                  }
                  return n;
              }

              static String baseName(String path) {
                  int i = path.lastIndexOf('/');
                  return i < 0 ? path : path.substring(i + 1);
              }

              static String dirOf(String path) {
                  int i = path.lastIndexOf('/');
                  return i < 0 ? "" : path.substring(0, i + 1);
              }

              static boolean isJunk(String path) {
                  String lower = path.toLowerCase(Locale.ROOT);
                  if (lower.startsWith("__macosx/") || lower.contains("/__macosx/")) {
                      return true;
                  }
                  if (lower.startsWith("../") || lower.contains("/../")) {
                      return true;
                  }
                  String base = baseName(lower);
                  return base.startsWith("._") || base.equals(".ds_store") || base.equals("thumbs.db");
              }

              private static boolean belongs(int ep, String rel, Map<Integer, Cand> best) {
                  String lower = rel.toLowerCase(Locale.ROOT);
                  for (Cand o : best.values()) {
                      if (o.ep != ep && lower.equals(o.base.toLowerCase(Locale.ROOT))) {
                          return false;
                      }
                  }
                  Matcher m = CK_EXT.matcher(lower);
                  if (m.find()) {
                      return Integer.parseInt(m.group(1)) == ep;
                  }
                  return true;
              }

              /** Returns episode number -> exe file name for every episode that was installed. */
              static Map<Integer, String> importZip(File zip, File outDir, Progress progress) throws IOException {
                  if (!outDir.isDirectory() && !outDir.mkdirs()) {
                      throw new IOException("No se pudo crear la carpeta de juegos");
                  }
                  ZipFile zf = new ZipFile(zip);
                  try {
                      List<ZipEntry> files = new ArrayList<ZipEntry>();
                      List<String> paths = new ArrayList<String>();
                      Enumeration<? extends ZipEntry> en = zf.entries();
                      while (en.hasMoreElements()) {
                          ZipEntry e = en.nextElement();
                          if (e.isDirectory()) {
                              continue;
                          }
                          String p = normalize(e.getName());
                          if (p.isEmpty() || p.endsWith("/") || isJunk(p)) {
                              continue;
                          }
                          files.add(e);
                          paths.add(p);
                      }

                      Map<Integer, Cand> best = new TreeMap<Integer, Cand>();
                      for (int i = 0; i < paths.size(); i++) {
                          String p = paths.get(i);
                          String base = baseName(p);
                          String lower = base.toLowerCase(Locale.ROOT);
                          int ep = 0;
                          String suffix = "";
                          Matcher m = KEEN_EXE.matcher(lower);
                          if (m.matches()) {
                              ep = Integer.parseInt(m.group(1));
                              suffix = m.group(2);
                          } else {
                              Matcher d = DREAMS_EXE.matcher(lower);
                              if (d.matches()) {
                                  ep = 7;
                                  suffix = d.group(1);
                              }
                          }
                          if (ep == 0) {
                              continue;
                          }
                          Cand c = new Cand();
                          c.ep = ep;
                          c.dir = dirOf(p);
                          c.base = base;
                          c.score = suffix.equals("c") ? 0 : (suffix.equals("e") ? 2 : 1);
                          Cand cur = best.get(ep);
                          if (cur == null || c.score > cur.score
                                  || (c.score == cur.score && c.dir.length() < cur.dir.length())) {
                              best.put(ep, c);
                          }
                      }
                      if (best.isEmpty()) {
                          throw new IOException("El ZIP no contiene ningún ejecutable de Commander Keen");
                      }

                      Map<String, Integer> dirCount = new HashMap<String, Integer>();
                      for (Cand c : best.values()) {
                          Integer n = dirCount.get(c.dir);
                          dirCount.put(c.dir, n == null ? 1 : n + 1);
                      }

                      Map<Integer, String> result = new TreeMap<Integer, String>();
                      int done = 0;
                      byte[] buf = new byte[128 * 1024];
                      for (Cand c : best.values()) {
                          if (progress != null) {
                              progress.update("Importando episodio " + c.ep + ": " + TITLES[c.ep],
                                      done * 100 / best.size());
                          }
                          boolean shared = dirCount.get(c.dir) > 1;
                          File tmp = new File(outDir, "ep" + c.ep + ".zip.tmp");
                          File dst = new File(outDir, "ep" + c.ep + ".zip");
                          int others = 0;
                          boolean hasData = false;
                          ZipOutputStream zo = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tmp)));
                          try {
                              for (int j = 0; j < paths.size(); j++) {
                                  String p = paths.get(j);
                                  if (!c.dir.isEmpty() && !p.startsWith(c.dir)) {
                                      continue;
                                  }
                                  String rel = p.substring(c.dir.length());
                                  if (rel.isEmpty()) {
                                      continue;
                                  }
                                  if (shared && !belongs(c.ep, rel, best)) {
                                      continue;
                                  }
                                  zo.putNextEntry(new ZipEntry(rel));
                                  InputStream in = zf.getInputStream(files.get(j));
                                  try {
                                      int n;
                                      while ((n = in.read(buf)) != -1) {
                                          zo.write(buf, 0, n);
                                      }
                                  } finally {
                                      in.close();
                                  }
                                  zo.closeEntry();
                                  if (!rel.equalsIgnoreCase(c.base)) {
                                      others++;
                                      Matcher m = CK_EXT.matcher(rel.toLowerCase(Locale.ROOT));
                                      if (m.find() && Integer.parseInt(m.group(1)) == c.ep) {
                                          hasData = true;
                                      }
                                  }
                              }
                          } finally {
                              zo.close();
                          }
                          boolean valid = c.ep <= 6 ? hasData : others > 0;
                          if (!valid) {
                              tmp.delete();
                              done++;
                              continue;
                          }
                          if (dst.exists() && !dst.delete()) {
                              throw new IOException("No se pudo reemplazar " + dst.getName());
                          }
                          if (!tmp.renameTo(dst)) {
                              throw new IOException("No se pudo guardar " + dst.getName());
                          }
                          result.put(c.ep, c.base);
                          done++;
                      }
                      if (result.isEmpty()) {
                          throw new IOException("Se encontraron ejecutables, pero faltan los archivos de datos de los juegos");
                      }

                      StringBuilder sb = new StringBuilder("{");
                      boolean first = true;
                      for (Map.Entry<Integer, String> e : result.entrySet()) {
                          if (!first) {
                              sb.append(',');
                          }
                          first = false;
                          sb.append('"').append(e.getKey()).append("\":\"")
                                  .append(e.getValue().replace("\\", "").replace("\"", "")).append('"');
                      }
                      sb.append('}');
                      OutputStream mo = new FileOutputStream(new File(outDir, "games.json"));
                      try {
                          mo.write(sb.toString().getBytes(StandardCharsets.UTF_8));
                      } finally {
                          mo.close();
                      }
                      if (progress != null) {
                          progress.update("Listo", 100);
                      }
                      return result;
                  } finally {
                      zf.close();
                  }
              }

              /** Returns the manifest JSON object text ("{}" when nothing is installed). */
              static String readManifest(File outDir) {
                  File f = new File(outDir, "games.json");
                  if (!f.isFile()) {
                      return "{}";
                  }
                  try {
                      java.io.FileInputStream in = new java.io.FileInputStream(f);
                      try {
                          java.io.ByteArrayOutputStream bo = new java.io.ByteArrayOutputStream();
                          byte[] b = new byte[4096];
                          int n;
                          while ((n = in.read(b)) != -1) {
                              bo.write(b, 0, n);
                          }
                          String s = new String(bo.toByteArray(), StandardCharsets.UTF_8).trim();
                          return s.startsWith("{") && s.endsWith("}") ? s : "{}";
                      } finally {
                          in.close();
                      }
                  } catch (IOException e) {
                      return "{}";
                  }
              }
          }
          __KEEN_EOF__
          cat > android/app/src/main/java/com/elpollopaco/commanderkeen/MainActivity.java <<'__KEEN_EOF__'
          package com.elpollopaco.commanderkeen;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.util.Log;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.ConsoleMessage;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import org.json.JSONObject;

          import java.io.BufferedOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.security.MessageDigest;

          public class MainActivity extends Activity {

              /** SHA-256 of the ZIP with the games (the only one the app accepts). */
              static final String EXPECTED_SHA256 =
                      "163f6742469a6ce9ec9e1f28a22cfcc377127ac276c3431555727ff693ba769e";

              private static final String TAG = "CommanderKeen";
              private static final String START_URL = "https://appassets.androidplatform.net/assets/www/index.html";
              private static final int REQ_ZIP = 4242;

              private WebView web;
              private File gamesDir;
              private WebViewAssetLoader loader;
              private volatile boolean importing = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }

                  gamesDir = new File(getFilesDir(), "games");
                  gamesDir.mkdirs();

                  loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .addPathHandler("/games/", new WebViewAssetLoader.InternalStoragePathHandler(this, gamesDir))
                          .build();

                  web = new WebView(this);
                  web.setBackgroundColor(0xFF000000);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);

                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage m) {
                          Log.d(TAG, m.message() + " (" + m.sourceId() + ":" + m.lineNumber() + ")");
                          return true;
                      }
                  });
                  web.loadUrl(START_URL);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemUi();
                  }
              }

              @SuppressWarnings("deprecation")
              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onBackPressed() {
                  web.evaluateJavascript("(window.__back ? window.__back() : false)", new ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String value) {
                          if (!"true".equals(value)) {
                              finish();
                          }
                      }
                  });
              }

              @Override
              @SuppressWarnings("deprecation")
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_ZIP) {
                      return;
                  }
                  if (resultCode == RESULT_OK && data != null && data.getData() != null) {
                      startImport(data.getData());
                  } else {
                      js("window.onImport && window.onImport({state:'cancel'})");
                  }
              }

              // ---------------------------------------------------------------- helpers

              private void js(final String code) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          if (web != null) {
                              web.evaluateJavascript(code, null);
                          }
                      }
                  });
              }

              private int lastPct = -1;
              private String lastText = "";

              private void progress(String text, int pct) {
                  if (pct == lastPct && text.equals(lastText)) {
                      return;
                  }
                  lastPct = pct;
                  lastText = text;
                  try {
                      JSONObject o = new JSONObject();
                      o.put("state", "progress");
                      o.put("text", text);
                      o.put("pct", pct);
                      js("window.onImport && window.onImport(" + o.toString() + ")");
                  } catch (Exception ignored) {
                  }
              }

              private void fail(String message) {
                  try {
                      JSONObject o = new JSONObject();
                      o.put("state", "error");
                      o.put("text", message);
                      js("window.onImport && window.onImport(" + o.toString() + ")");
                  } catch (Exception ignored) {
                  }
              }

              private void finished() {
                  js("window.onImport && window.onImport({state:'done'})");
              }

              private long querySize(Uri uri) {
                  Cursor c = null;
                  try {
                      c = getContentResolver().query(uri, new String[]{OpenableColumns.SIZE}, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int idx = c.getColumnIndex(OpenableColumns.SIZE);
                          if (idx >= 0 && !c.isNull(idx)) {
                              return c.getLong(idx);
                          }
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) {
                          c.close();
                      }
                  }
                  return -1;
              }

              private static String toHex(byte[] b) {
                  StringBuilder sb = new StringBuilder(b.length * 2);
                  for (int i = 0; i < b.length; i++) {
                      sb.append(String.format("%02x", b[i] & 0xff));
                  }
                  return sb.toString();
              }

              private void startImport(final Uri uri) {
                  if (importing) {
                      return;
                  }
                  importing = true;
                  lastPct = -1;
                  lastText = "";
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          File tmp = new File(getCacheDir(), "import.zip");
                          try {
                              doImport(uri, tmp);
                          } catch (Throwable t) {
                              Log.e(TAG, "import failed", t);
                              String msg = t.getMessage();
                              fail(msg == null || msg.length() == 0 ? t.getClass().getSimpleName() : msg);
                          } finally {
                              tmp.delete();
                              importing = false;
                          }
                      }
                  }, "keen-import").start();
              }

              private void doImport(Uri uri, File tmp) throws Exception {
                  progress("Leyendo el ZIP...", 0);
                  long total = querySize(uri);
                  MessageDigest md = MessageDigest.getInstance("SHA-256");
                  InputStream is = getContentResolver().openInputStream(uri);
                  if (is == null) {
                      throw new IOException("No se pudo abrir el archivo elegido");
                  }
                  OutputStream os = new BufferedOutputStream(new FileOutputStream(tmp));
                  try {
                      byte[] buf = new byte[256 * 1024];
                      long done = 0;
                      int n;
                      while ((n = is.read(buf)) != -1) {
                          md.update(buf, 0, n);
                          os.write(buf, 0, n);
                          done += n;
                          if (total > 0) {
                              progress("Verificando el ZIP...", (int) (done * 40 / total));
                          }
                      }
                  } finally {
                      try {
                          is.close();
                      } catch (IOException ignored) {
                      }
                      os.close();
                  }

                  String hex = toHex(md.digest());
                  if (!hex.equalsIgnoreCase(EXPECTED_SHA256)) {
                      fail("Este ZIP no es el correcto: su SHA-256 no coincide con el esperado. Se ha descartado.");
                      return;
                  }

                  progress("ZIP verificado. Importando juegos...", 40);
                  File[] old = gamesDir.listFiles();
                  if (old != null) {
                      for (File f : old) {
                          f.delete();
                      }
                  }
                  KeenImporter.importZip(tmp, gamesDir, new KeenImporter.Progress() {
                      @Override
                      public void update(String text, int percent) {
                          progress(text, 40 + percent * 60 / 100);
                      }
                  });
                  finished();
              }

              // ----------------------------------------------------------- JS bridge

              private final class Bridge {

                  @JavascriptInterface
                  public String getState() {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("games", new JSONObject(KeenImporter.readManifest(gamesDir)));
                          o.put("busy", importing);
                          o.put("hash", EXPECTED_SHA256);
                          return o.toString();
                      } catch (Exception e) {
                          return "{\"games\":{},\"busy\":false,\"hash\":\"\"}";
                      }
                  }

                  @JavascriptInterface
                  public void pickZip() {
                      runOnUiThread(new Runnable() {
                          @Override
                          @SuppressWarnings("deprecation")
                          public void run() {
                              if (importing) {
                                  return;
                              }
                              try {
                                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                                  i.addCategory(Intent.CATEGORY_OPENABLE);
                                  i.setType("*/*");
                                  startActivityForResult(i, REQ_ZIP);
                              } catch (Exception e) {
                                  try {
                                      Intent g = new Intent(Intent.ACTION_GET_CONTENT);
                                      g.addCategory(Intent.CATEGORY_OPENABLE);
                                      g.setType("*/*");
                                      startActivityForResult(g, REQ_ZIP);
                                  } catch (Exception e2) {
                                      fail("No hay ninguna app para elegir archivos en este dispositivo");
                                  }
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void deleteGames() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              File[] fs = gamesDir.listFiles();
                              if (fs != null) {
                                  for (File f : fs) {
                                      f.delete();
                                  }
                              }
                              try {
                                  WebStorage.getInstance().deleteAllData();
                              } catch (Exception ignored) {
                              }
                              web.loadUrl(START_URL);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void showKeyboard(final boolean show) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                              if (imm == null) {
                                  return;
                              }
                              if (show) {
                                  web.requestFocus();
                                  imm.showSoftInput(web, InputMethodManager.SHOW_IMPLICIT);
                              } else {
                                  imm.hideSoftInputFromWindow(web.getWindowToken(), 0);
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void quit() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              finish();
                          }
                      });
                  }
              }
          }
