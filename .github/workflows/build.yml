          <div id="toast"></div>

          <script>
          (function () {
            'use strict';

            var EP = [null,
              { t: 'Marooned on Mars', s: 'Invasion of the Vorticons' },
              { t: 'The Earth Explodes', s: 'Invasion of the Vorticons' },
              { t: 'Keen Must Die!', s: 'Invasion of the Vorticons' },
              { t: 'Secret of the Oracle', s: 'Goodbye, Galaxy!' },
              { t: 'The Armageddon Machine', s: 'Goodbye, Galaxy!' },
              { t: 'Aliens Ate My Baby Sitter!', s: 'Episodio 6' },
              { t: 'Keen Dreams', s: 'Commander Keen in Keen Dreams' }
            ];
            var K = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, CTRL: 17, ALT: 18, SPACE: 32, ENTER: 13,
                      ESC: 27, F1: 112, F2: 113, F3: 114, Y: 89, N: 78, BACK: 8 };

            function $(id) { return document.getElementById(id); }
            var root = document.documentElement;
            var ci = null;
            var screenNow = 'menu';
            var games = {};
            var canvas = $('jsdos');

            // ------------------------------------------------------------ helpers
            function toast(msg) {
              var t = $('toast');
              t.textContent = msg;
              t.style.display = 'block';
              clearTimeout(toast._h);
              toast._h = setTimeout(function () { t.style.display = 'none'; }, 3500);
            }

            function fit() {
              var w = window.innerWidth, h = window.innerHeight;
              var cw = Math.min(w, h * 4 / 3);
              root.style.setProperty('--cw', Math.floor(cw) + 'px');
              root.style.setProperty('--ch', Math.floor(cw * 3 / 4) + 'px');
            }
            window.addEventListener('resize', fit);
            fit();

            function show(which) {
              screenNow = which;
              $('menu').style.display = which === 'menu' ? 'block' : 'none';
              $('game').style.display = which === 'game' ? 'block' : 'none';
            }

            function busy(on, text, pct, withBack) {
              $('busy').style.display = on ? 'flex' : 'none';
              if (!on) { return; }
              $('busyText').textContent = text || '';
              var bar = $('busyBar');
              if (typeof pct === 'number' && pct >= 0) {
                bar.style.display = 'block';
                $('busyFill').style.width = Math.max(0, Math.min(100, pct)) + '%';
              } else {
                bar.style.display = 'none';
              }
              $('busyBtn').style.display = withBack ? 'inline-block' : 'none';
            }

            function ask(text, yesLabel, cb) {
              $('confirmText').textContent = text;
              $('cYes').textContent = yesLabel;
              $('confirm').style.display = 'flex';
              $('cYes').onclick = function () { $('confirm').style.display = 'none'; cb(); };
              $('cNo').onclick = function () { $('confirm').style.display = 'none'; };
            }

            // ------------------------------------------------------------ menu
            function getState() {
              try { return JSON.parse(window.Android.getState()); } catch (e) { return { games: {}, hash: '' }; }
            }

            function render() {
              var st = getState();
              games = st.games || {};
              var count = 0, n;
              var grid = $('grid');
              grid.innerHTML = '';
              for (n = 1; n <= 7; n++) {
                if (games[n]) { count++; }
                var b = document.createElement('button');
                b.className = 'card' + (games[n] ? '' : ' off');
                var a = document.createElement('div'); a.className = 'num'; a.textContent = String(n);
                var c = document.createElement('div'); c.className = 'ct'; c.textContent = EP[n].t;
                var d = document.createElement('div'); d.className = 'cs'; d.textContent = EP[n].s;
                b.appendChild(a); b.appendChild(c); b.appendChild(d);
                b.disabled = !games[n];
                b.addEventListener('click', (function (k) { return function () { launch(k); }; })(n));
                grid.appendChild(b);
              }
              var h = st.hash || '';
              var short = h ? h.substring(0, 10) + '...' + h.substring(h.length - 8) : '';
              var info = $('info');
              info.innerHTML = '';
              var p1 = document.createElement('div');
              if (count === 0) {
                p1.textContent = 'Todav\u00eda no hay juegos. Pulsa \u00abImportar ZIP\u00bb y elige el ZIP con los juegos. ' +
                  'La app comprueba su SHA-256 y copia los juegos dentro de la app; despu\u00e9s puedes borrar el ZIP.';
              } else {
                p1.textContent = count + ' de 7 episodios disponibles. Puedes borrar el ZIP original.';
              }
              info.appendChild(p1);
              if (short) {
                var p2 = document.createElement('div');
                p2.textContent = 'SHA-256 esperado: ';
                var sp = document.createElement('span'); sp.id = 'hash'; sp.textContent = short;
                p2.appendChild(sp);
                info.appendChild(p2);
              }
              $('bDelete').style.display = count === 0 ? 'none' : 'inline-block';
              $('bImport').textContent = count === 0 ? 'Importar ZIP de los juegos' : 'Importar de nuevo';
              $('bImport').className = 'pbtn ' + (count === 0 ? 'big' : 'alt');
              show('menu');
            }

            $('bImport').addEventListener('click', function () {
              try { window.Android.pickZip(); } catch (e) { toast('No se pudo abrir el selector de archivos'); }
            });
            $('bDelete').addEventListener('click', function () {
              ask('Se borrar\u00e1n los juegos importados y tambi\u00e9n las partidas guardadas. ' +
                  'Para volver a jugar tendr\u00e1s que importar el ZIP otra vez.', 'Borrar', function () {
                try { window.Android.deleteGames(); } catch (e) { /* ignore */ }
              });
            });

            window.onImport = function (o) {
              if (!o) { return; }
              if (o.state === 'progress') {
                busy(true, o.text, o.pct, false);
              } else if (o.state === 'done') {
                busy(false);
                render();
                toast('Juegos importados');
              } else if (o.state === 'error') {
                busy(true, o.text || 'Error', -1, true);
                $('busyBtn').onclick = function () { busy(false); render(); };
              } else if (o.state === 'cancel') {
                busy(false);
              }
            };

            // ------------------------------------------------------------ keys
            var held = {};
            var sentCount = 0, lastCode = 0;
            var KEYINFO = {
              37: ['ArrowLeft', 'ArrowLeft'], 38: ['ArrowUp', 'ArrowUp'], 39: ['ArrowRight', 'ArrowRight'],
              40: ['ArrowDown', 'ArrowDown'], 17: ['Control', 'ControlLeft'], 18: ['Alt', 'AltLeft'],
              32: [' ', 'Space'], 13: ['Enter', 'Enter'], 27: ['Escape', 'Escape'], 8: ['Backspace', 'Backspace'],
              112: ['F1', 'F1'], 113: ['F2', 'F2'], 114: ['F3', 'F3']
            };

            // Second path: a real DOM keyboard event on the canvas (what js-dos/SDL listens to with a physical keyboard).
            function domKey(code, down) {
              var info = KEYINFO[code], ch = String.fromCharCode(code);
              if (!info) {
                info = [ch.toLowerCase(), (code >= 65 && code <= 90) ? 'Key' + ch : ((code >= 48 && code <= 57) ? 'Digit' + ch : '')];
              }
              var ev;
              try {
                ev = new KeyboardEvent(down ? 'keydown' : 'keyup', {
                  key: info[0], code: info[1], keyCode: code, which: code,
                  ctrlKey: !!held[K.CTRL], altKey: !!held[K.ALT], shiftKey: false,
                  bubbles: true, cancelable: true
                });
              } catch (e) { return; }
              try {
                if (ev.keyCode !== code) { Object.defineProperty(ev, 'keyCode', { get: function () { return code; } }); }
                if (ev.which !== code) { Object.defineProperty(ev, 'which', { get: function () { return code; } }); }
              } catch (e) { /* ignore */ }
              try { canvas.dispatchEvent(ev); } catch (e) { /* ignore */ }
            }

            function send(code, down) {
              sentCount++;
              lastCode = code;
              try { ci.simulateKeyEvent(code, down); } catch (e) { /* ignore */ }
              domKey(code, down);
            }

            function key(code, down) {
              if (!ci) { return; }
              if (down) {
                held[code] = (held[code] || 0) + 1;
                if (held[code] > 1) { return; }
              } else {
                if (!held[code]) { return; }
                held[code]--;
                if (held[code] > 0) { return; }
                delete held[code];
              }
              send(code, down);
            }
            function releaseAll() {
              var codes = Object.keys(held), i;
              held = {};
              if (ci) {
                for (i = 0; i < codes.length; i++) { send(parseInt(codes[i], 10), false); }
              }
              setDir({ l: false, r: false, u: false, d: false });
            }
            function tap(code) {
              key(code, true);
              setTimeout(function () { key(code, false); }, 80);
            }

            function bindHold(el, codes) {
              var pid = null;
              function down(e) {
                e.preventDefault();
                if (pid !== null) { return; }
                pid = e.pointerId;
                try { el.setPointerCapture(pid); } catch (x) { /* ignore */ }
                el.classList.add('on');
                for (var i = 0; i < codes.length; i++) { key(codes[i], true); }
              }
              function up(e) {
                if (e.pointerId !== pid) { return; }
                pid = null;
                el.classList.remove('on');
                for (var i = 0; i < codes.length; i++) { key(codes[i], false); }
              }
              el.addEventListener('pointerdown', down);
              el.addEventListener('pointerup', up);
              el.addEventListener('pointercancel', up);
              el.addEventListener('lostpointercapture', up);
            }
            function bindTap(el, code) {
              el.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                el.classList.add('on');
                tap(code);
                setTimeout(function () { el.classList.remove('on'); }, 150);
              });
            }

            // d-pad (8 directions, you can slide the finger around)
            var dir = { l: false, r: false, u: false, d: false };
            var dpad = $('dpad'), dpadPtr = null;
            function setDir(n) {
              if (n.l !== dir.l) { dir.l = n.l; key(K.LEFT, n.l); $('dL').classList.toggle('on', n.l); }
              if (n.r !== dir.r) { dir.r = n.r; key(K.RIGHT, n.r); $('dR').classList.toggle('on', n.r); }
              if (n.u !== dir.u) { dir.u = n.u; key(K.UP, n.u); $('dU').classList.toggle('on', n.u); }
              if (n.d !== dir.d) { dir.d = n.d; key(K.DOWN, n.d); $('dD').classList.toggle('on', n.d); }
            }
            function dpadUpdate(e) {
              var r = dpad.getBoundingClientRect();
              var R = r.width / 2;
              var dx = (e.clientX - (r.left + R)) / R;
              var dy = (e.clientY - (r.top + R)) / R;
              setDir({ l: dx < -0.3, r: dx > 0.3, u: dy < -0.3, d: dy > 0.3 });
            }
            dpad.addEventListener('pointerdown', function (e) {
              e.preventDefault();
              if (dpadPtr !== null) { return; }
              dpadPtr = e.pointerId;
              try { dpad.setPointerCapture(dpadPtr); } catch (x) { /* ignore */ }
              dpadUpdate(e);
            });
            dpad.addEventListener('pointermove', function (e) { if (e.pointerId === dpadPtr) { dpadUpdate(e); } });
            function dpadEnd(e) {
              if (e.pointerId !== dpadPtr) { return; }
              dpadPtr = null;
              setDir({ l: false, r: false, u: false, d: false });
            }
            dpad.addEventListener('pointerup', dpadEnd);
            dpad.addEventListener('pointercancel', dpadEnd);
            dpad.addEventListener('lostpointercapture', dpadEnd);

            bindHold($('bJump'), [K.CTRL]);
            bindHold($('bPogo'), [K.ALT]);
            bindHold($('bSpace'), [K.SPACE]);
            bindHold($('bFire'), [K.CTRL, K.ALT]);
            bindTap($('tEsc'), K.ESC);
            bindTap($('tEnter'), K.ENTER);

            function setCaps(ep) {
              var fire = $('bFire'), sp = $('bSpace'), po = $('bPogo');
              fire.classList.toggle('hide', ep > 3);
              if (ep <= 3) {
                sp.querySelector('i').textContent = 'Estado';
                po.querySelector('i').textContent = 'Pogo';
              } else if (ep <= 6) {
                sp.querySelector('i').textContent = 'Disparo';
                po.querySelector('i').textContent = 'Pogo';
              } else {
                sp.querySelector('i').textContent = '';
                po.querySelector('i').textContent = 'Lanzar';
              }
            }

            // extra keys in the pause panel
            (function () {
              var list = [['Y', K.Y], ['N', K.N], ['F1', K.F1], ['F2', K.F2], ['F3', K.F3], ['ESPACIO', K.SPACE], ['ENTER', K.ENTER]];
              var cont = $('keys');
              list.forEach(function (it) {
                var b = document.createElement('button');
                b.className = 'tb';
                b.textContent = it[0];
                bindTap(b, it[1]);
                cont.appendChild(b);
              });
            })();

            // soft keyboard (for names when saving)
            var kb = $('kb'), kbOn = false;
            $('tKb').addEventListener('click', function () {
              kbOn = !kbOn;
              $('tKb').classList.toggle('on', kbOn);
              if (kbOn) {
                kb.focus();
                try { window.Android.showKeyboard(true); } catch (e) { /* ignore */ }
              } else {
                kb.blur();
                try { window.Android.showKeyboard(false); } catch (e) { /* ignore */ }
              }
            });
            kb.addEventListener('keydown', function (e) {
              e.stopPropagation();
              if (e.key === 'Backspace') { tap(K.BACK); e.preventDefault(); }
              else if (e.key === 'Enter') { tap(K.ENTER); e.preventDefault(); }
            });
            kb.addEventListener('keyup', function (e) { e.stopPropagation(); });
            kb.addEventListener('input', function () {
              var v = kb.value.toUpperCase();
              kb.value = '';
              var i, delay = 0;
              for (i = 0; i < v.length; i++) {
                var code = v.charCodeAt(i);
                if ((code >= 65 && code <= 90) || (code >= 48 && code <= 57) || code === 32) {
                  (function (c, d) { setTimeout(function () { tap(c); }, d); })(code, delay);
                  delay += 110;
                }
              }
            });

            // pause panel
            function togglePause(force) {
              var p = $('pause');
              var open = typeof force === 'boolean' ? force : p.style.display !== 'flex';
              p.style.display = open ? 'flex' : 'none';
              releaseAll();
              if (open) {
                $('dbg').textContent = 'Motor: ' + (ci ? 'listo' : 'NO listo') +
                  ' | simulateKeyEvent: ' + (ci && typeof ci.simulateKeyEvent === 'function' ? 'si' : 'no') +
                  ' | teclas enviadas: ' + sentCount + ' | ultima: ' + lastCode;
              }
            }
            $('tMenu').addEventListener('click', function () { togglePause(true); });
            $('pResume').addEventListener('click', function () { togglePause(false); });
            $('pExit').addEventListener('click', function () { exitToMenu(); });
            $('busyBtn').addEventListener('click', function () { /* replaced per use */ });

            window.__back = function () {
              if ($('confirm').style.display === 'flex') { $('confirm').style.display = 'none'; return true; }
              if ($('busy').style.display === 'flex') { return true; }
              if (screenNow === 'game') { togglePause(); return true; }
              return false;
            };
            document.addEventListener('visibilitychange', function () { if (document.hidden) { releaseAll(); } });

            // ------------------------------------------------------------ game
            function exitToMenu() {
              releaseAll();
              var c = ci;
              ci = null;
              $('pause').style.display = 'none';
              busy(true, 'Guardando y volviendo al men\u00fa...', -1, false);
              if (c) { try { c.exit(); } catch (e) { /* ignore */ } }
              setTimeout(function () { location.reload(); }, c ? 1000 : 50);
            }

            function failGame(e) {
              var msg = (e && e.message) ? e.message : String(e);
              busy(true, 'No se pudo iniciar el juego:\n' + msg, -1, true);
              $('busyBtn').onclick = function () { location.reload(); };
            }

            function setupGamepad(c) {
              try {
                if (window.DosController && typeof window.DosController.Gamepad === 'function') {
                  window.DosController.Gamepad(c, {
                    gamepads: [{ keymap: { a: K.CTRL, b: K.ALT, x: K.SPACE, y: K.ENTER, start: K.ESC, back: K.ESC },
                                 mapArrows: true, stickThreshold: 0.6 }],
                    scanEvery: 200,
                    scanOnTick: true
                  });
                }
              } catch (e) { /* the on-screen controls still work */ }
            }

            function launch(n) {
              var exe = games[n];
              if (!exe) { return; }
              if (typeof window.Dos !== 'function') {
                toast('No se cargó DOSBox (js-dos). Reinstala la app.');
                return;
              }
              show('game');
              fit();
              setCaps(n);
              busy(true, 'Cargando DOSBox...', 0, false);
              try {
                window.Dos(canvas, {
                  wdosboxUrl: 'jsdos/wdosbox.js',
                  cycles: 'max',
                  autolock: false,
                  onprogress: function (stage, total, loaded) {
                    var p = total > 0 ? Math.round(loaded * 100 / total) : -1;
                    busy(true, (stage ? String(stage) : 'Cargando') + '...', p, false);
                  },
                  onerror: function (m) { failGame(m); },
                  log: function () { }
                }).ready(function (fs, main) {
                  fs.extract('/games/ep' + n + '.zip', '/keen' + n).then(function () {
                    busy(true, 'Iniciando ' + EP[n].t + '...', 100, false);
                    return main(['-c', 'cd keen' + n, '-c', exe]);
                  }).then(function (c) {
                    ci = c;
                    try { canvas.setAttribute('tabindex', '0'); canvas.focus(); } catch (e) { /* ignore */ }
                    busy(false);
                    setupGamepad(c);
                  }).catch(function (e) { failGame(e); });
                }).catch(function (e) { failGame(e); });
              } catch (e) {
                failGame(e);
              }
            }

            // ------------------------------------------------------------ start
            render();
          })();
          </script>
          </body>
          </html>
          __KEEN_EOF__

      - name: Descargar DOSBox (js-dos 6.22.60)
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/android/app/src/main/assets/www/jsdos"
          mkdir -p "$DEST" /tmp/jsdos-pkg
          cd /tmp/jsdos-pkg
          if npm pack js-dos@6.22.60 --silent; then
            tar -xzf js-dos-6.22.60.tgz || true
          fi
          echo "Contenido de dist de js-dos:"
          ls -la /tmp/jsdos-pkg/package/dist 2>/dev/null | head -n 40 || true
          for f in js-dos.js wdosbox.js wdosbox.wasm.js; do
            src="/tmp/jsdos-pkg/package/dist/$f"
            if [ ! -s "$src" ]; then
              src="$(find /tmp/jsdos-pkg/package -type f -name "$f" 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$src" ] && [ -s "$src" ]; then
              cp "$src" "$DEST/$f"
            else
              echo "No estaba en el paquete npm; descargando $f desde jsDelivr (js-dos 6.22.60)"
              curl -fsSL "https://cdn.jsdelivr.net/npm/js-dos@6.22.60/dist/$f" -o "$DEST/$f"
            fi
            test -s "$DEST/$f" || { echo "ERROR: falta $f"; exit 1; }
          done
          grep -q "Dos" "$DEST/js-dos.js" || { echo "ERROR: js-dos.js no parece valido"; exit 1; }
          ls -la "$DEST"

      - name: Icono de la app (icon.png)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python - <<'__KEEN_PY__'
          import os
          from PIL import Image, ImageDraw
          ws = os.environ["GITHUB_WORKSPACE"]
          src = os.path.join(ws, "icon.png")
          if os.path.isfile(src):
              img = Image.open(src).convert("RGBA")
              print("Usando icon.png de la raiz del repo:", img.size)
          else:
              print("AVISO: no hay icon.png en la raiz del repo; se usa un icono de ejemplo")
              img = Image.new("RGBA", (512, 512), (0, 0, 170, 255))
              ImageDraw.Draw(img).ellipse((96, 96, 416, 416), fill=(255, 212, 0, 255))
          w, h = img.size
          s = min(w, h)
          left, top = (w - s) // 2, (h - s) // 2
          img = img.crop((left, top, left + s, top + s))
          for name, size in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              d = os.path.join(ws, "android", "app", "src", "main", "res", "mipmap-" + name)
              os.makedirs(d, exist_ok=True)
              img.resize((size, size), Image.LANCZOS).save(os.path.join(d, "ic_launcher.png"))
          print("Iconos generados")
          __KEEN_PY__

      - name: Licencias del SDK de Android
        run: |
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "Licencias del SDK procesadas"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/CommanderKeen.apk
          ls -la dist

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CommanderKeen-APK
          path: dist/CommanderKeen.apk
          if-no-files-found: error
